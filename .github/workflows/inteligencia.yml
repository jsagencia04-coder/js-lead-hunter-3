name: Inteligência digital

# Processo separado da importação: pesquisa site, Instagram, Facebook, Perfil no
# Google, LinkedIn e WhatsApp das empresas da fila (prioriza as recém-abertas).
# As migrations são aplicadas pelo workflow "Worker de importação".
#
# Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL            obrigatório (o mesmo do worker)
#   GOOGLE_PLACES_API_KEY   opcional (Perfil da Empresa no Google; serviço pago com cota gratuita)
#   BRAVE_SEARCH_API_KEY    opcional (pesquisa web de site e redes; serviço pago)
# Sem as chaves, só o domínio do e-mail cadastral é verificado e os demais canais ficam "pendente".
# Limites diários e orçamento: Inteligência digital → Configuração, no sistema.
#
# ATENÇÃO: em repositório público os logs do Actions são públicos. O motor registra só totais.

# CÓPIA DE TRABALHO (js-lead-hunter-3): o agendamento automático está DESLIGADO aqui,
# para não haver um segundo worker gravando no banco de produção.
# Só roda manualmente e se a variável PERMITIR_WORKER=sim existir neste repositório.
# NUNCA cadastre aqui o DATABASE_URL de produção: use o banco de homologação.
on:
  workflow_dispatch:

concurrency:
  group: inteligencia-digital
  cancel-in-progress: false

jobs:
  intel:
    if: vars.PERMITIR_WORKER == 'sim'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      DB_SIZE_LIMIT_MB: ${{ vars.DB_SIZE_LIMIT_MB || '500' }}
    steps:
      - name: Verifica configuração
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::Secret DATABASE_URL não configurado"; echo "ok=false" >> "$GITHUB_OUTPUT";
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Instala dependências
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -r worker/requirements.txt
      - name: Rodada de inteligência digital
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
        run: python -m lead_hunter intel --minutos 45
