name: Worker de importação

# Roda a cada hora: aplica migrations pendentes, atende pedidos feitos na
# Central de importação e verifica se a Receita publicou nova competência.
# O download é retomável entre execuções (cache dos ZIPs).
#
# Configuração (Settings → Secrets and variables → Actions):
#   Secret   DATABASE_URL      conexão "Session pooler" do Supabase (porta 5432)
#   Variable LEAD_WINDOW_DAYS  opcional (padrão 7; plano gratuito do Supabase tem 500 MB)

# CÓPIA DE TRABALHO (js-lead-hunter-3): o agendamento automático está DESLIGADO aqui,
# para não haver um segundo worker gravando no banco de produção.
# Só roda manualmente e se a variável PERMITIR_WORKER=sim existir neste repositório.
# NUNCA cadastre aqui o DATABASE_URL de produção: use o banco de homologação.
on:
  workflow_dispatch:

concurrency:
  group: worker-importacao
  cancel-in-progress: false

jobs:
  worker:
    if: vars.PERMITIR_WORKER == 'sim'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_DIR: ${{ github.workspace }}/data
      LEAD_WINDOW_DAYS: ${{ vars.LEAD_WINDOW_DAYS || '7' }}
      WORKER_MODE: agendado
      WORKER_INTERVAL_MIN: "60"
      MAX_RUNTIME_MINUTES: "320"
      DOWNLOAD_CONNECTIONS: "8"
      DUCKDB_MEMORY: 8GB
      DUCKDB_THREADS: "4"
      CHECK_INTERVAL_HOURS: "6"
      DB_SIZE_LIMIT_MB: ${{ vars.DB_SIZE_LIMIT_MB || '500' }}
    steps:
      - name: Verifica configuração
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret DATABASE_URL não configurado. Veja o README (Worker no GitHub Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'

      - name: Libera espaço em disco
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instala dependências
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -r worker/requirements.txt

      - name: Restaura downloads em andamento
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/zips
          key: rf-zips-${{ github.run_id }}
          restore-keys: rf-zips-

      - name: Aplica migrations pendentes
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
        run: python -m lead_hunter migrate

      - name: Rodada do worker
        if: steps.cfg.outputs.ok == 'true'
        working-directory: worker
        run: python -m lead_hunter once

      - name: Guarda downloads em andamento
        if: always() && steps.cfg.outputs.ok == 'true' && hashFiles('data/zips/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/zips
          key: rf-zips-${{ github.run_id }}

      - name: Log da rodada
        if: always() && steps.cfg.outputs.ok == 'true'
        run: tail -n 80 data/logs/worker.log 2>/dev/null || true
