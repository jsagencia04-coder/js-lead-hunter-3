# Nginx do JS Lead Hunter (container "jslh-web"), atrás do Nginx do painel ICP.
# O painel termina o HTTPS e encaminha o domínio para 127.0.0.1:8090.
# Aqui: telas (arquivos estáticos) + repasse das APIs do Supabase auto-hospedado.
# O Studio (painel do Supabase) NÃO é exposto: só /auth, /rest, /functions e /storage.

server {
    listen 80;
    server_name _;

    root /srv/www/atual;   # link relativo para a versão publicada (04-publicar-frontend.sh)
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # APIs do Supabase (mesmo domínio das telas: sem CORS entre domínios)
    location ~ ^/(auth|rest|functions|storage)/v1/ {
        proxy_pass http://api-gw:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota abre o index.html; o index nunca fica em cache
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
