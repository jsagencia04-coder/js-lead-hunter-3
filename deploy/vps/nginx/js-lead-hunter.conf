# Referência de proxy reverso para a VPS (Nginx no host).
# Se os domínios forem gerenciados pelo painel ICP, crie no painel:
#   - leadhunter.jsdesigner.pro      -> site estático em /srv/js-lead-hunter/www (com fallback para /index.html)
#   - api.leadhunter.jsdesigner.pro  -> proxy reverso para http://127.0.0.1:8000
# e ative o SSL do painel. Os blocos abaixo fazem o mesmo num Nginx comum (certificados via certbot).

server {
    listen 80;
    server_name leadhunter.jsdesigner.pro api.leadhunter.jsdesigner.pro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Telas (React, arquivos estáticos)
server {
    listen 443 ssl http2;
    server_name leadhunter.jsdesigner.pro;
    ssl_certificate     /etc/letsencrypt/live/leadhunter.jsdesigner.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadhunter.jsdesigner.pro/privkey.pem;

    root /srv/js-lead-hunter/www;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}

# API (Supabase auto-hospedado: login, dados e funções)
server {
    listen 443 ssl http2;
    server_name api.leadhunter.jsdesigner.pro;
    ssl_certificate     /etc/letsencrypt/live/api.leadhunter.jsdesigner.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.leadhunter.jsdesigner.pro/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
